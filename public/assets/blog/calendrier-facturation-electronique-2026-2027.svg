<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Paper texture grain simulation -->
    <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.94   0 0 0 0 0.92   0 0 0 0.07 0" />
      <feComposite in2="SourceGraphic" in="glitch" operator="in" />
    </filter>
  </defs>

  <!-- Cream Paper Background -->
  <rect width="1920" height="1080" fill="#f4f0ea" />

  <!-- Subtle Paper Grain Overlay -->
  <rect width="1920" height="1080" fill="#eae4da" opacity="0.35" />

  <!-- LEFT TYPOGRAPHY COLUMN -->
  <g transform="translate(120, 0)">
    <!-- Category Eyebrow -->
    <text x="0" y="160" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#78736a">
      RESSOURCES · RÉFORME 2026
    </text>

    <!-- Main Title Lines -->
    <text x="0" y="380" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      Facture électronique :
    </text>
    <text x="0" y="475" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      calendrier 2026-2027
    </text>
    
    <text x="0" y="570" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      pour vos PDF
    </text>

    <!-- Thick Emerald Accent Bar -->
    <rect x="0" y="630" width="650" height="28" rx="4" fill="#02b282" />

    <!-- Subtitle -->
    <text x="0" y="725" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="34" 
          font-weight="400" 
          letter-spacing="-0.5" 
          fill="#141312">
      Échéances de réception et d’émission pour grandes entreprises, ETI et PME
    </text>

    <!-- Brand / URL at bottom -->
    <text x="0" y="940" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#141312">
      facturxfacile.com
    </text>
  </g>

  <!-- RIGHT MINIMALIST RISOGRAPH ILLUSTRATION -->
  
      <!-- Calendar Milestone Timeline -->
      <g transform="translate(1350, 480)">
        <!-- Pedestal -->
        <path d="M-240 280 L240 280 L280 360 L-280 360 Z" fill="#8cb39d" />
        <rect x="-280" y="360" width="560" height="60" fill="#4a735c" />

        <!-- Central Timeline Track -->
        <rect x="-14" y="-180" width="28" height="460" rx="14" fill="#054c3a" />

        <!-- Milestone 1: 1er Septembre 2026 (Réception) -->
        <g transform="translate(-130, -70)">
          <rect x="-110" y="-60" width="220" height="110" rx="12" fill="#fbf9f5" stroke="#02b282" stroke-width="8" />
          <text x="0" y="-20" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#02b282" text-anchor="middle">1ER SEPT. 2026</text>
          <text x="0" y="10" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#141312" text-anchor="middle">RÉCEPTION (TOUS)</text>
          <text x="0" y="32" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#78736a" text-anchor="middle">Émission Grandes &amp; ETI</text>
          <circle cx="130" cy="-5" r="16" fill="#02b282" stroke="#ffffff" stroke-width="4" />
        </g>

        <!-- Milestone 2: 1er Septembre 2027 (Émission PME/TPE) -->
        <g transform="translate(130, 90)">
          <rect x="-110" y="-60" width="220" height="110" rx="12" fill="#02b282" stroke="#054c3a" stroke-width="8" />
          <text x="0" y="-20" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1ER SEPT. 2027</text>
          <text x="0" y="10" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ÉMISSION PME / TPE</text>
          <text x="0" y="32" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#e6f8f2" text-anchor="middle">Micro-entrepreneurs</text>
          <circle cx="-130" cy="-5" r="16" fill="#e05656" stroke="#ffffff" stroke-width="4" />
        </g>

        <!-- Sun / target indicator -->
        <circle cx="0" cy="-210" r="38" fill="#e05656" />
        <path d="M-10 -210 L-2 -200 L14 -220" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      </g>
    
</svg>