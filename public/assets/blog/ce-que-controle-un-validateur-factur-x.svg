<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Paper texture grain simulation -->
    <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.94   0 0 0 0 0.92   0 0 0 0.07 0" />
      <feComposite in2="SourceGraphic" in="glitch" operator="in" />
    </filter>
  </defs>

  <!-- Cream Paper Background -->
  <rect width="1920" height="1080" fill="#f4f0ea" />

  <!-- Subtle Paper Grain Overlay -->
  <rect width="1920" height="1080" fill="#eae4da" opacity="0.35" />

  <!-- LEFT TYPOGRAPHY COLUMN -->
  <g transform="translate(120, 0)">
    <!-- Category Eyebrow -->
    <text x="0" y="160" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#78736a">
      RESSOURCES · NORMES · 2026
    </text>

    <!-- Main Title Lines -->
    <text x="0" y="380" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      Ce que contrôle un
    </text>
    <text x="0" y="475" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      validateur Factur-X
    </text>
    
    <text x="0" y="570" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      (et ce qu’il ignore)
    </text>

    <!-- Thick Emerald Accent Bar -->
    <rect x="0" y="630" width="650" height="28" rx="4" fill="#02b282" />

    <!-- Subtitle -->
    <text x="0" y="725" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="34" 
          font-weight="400" 
          letter-spacing="-0.5" 
          fill="#141312">
      Conteneur PDF/A-3, syntaxe XML, Schematron et contrôle visuel
    </text>

    <!-- Brand / URL at bottom -->
    <text x="0" y="940" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#141312">
      facturxfacile.com
    </text>
  </g>

  <!-- RIGHT MINIMALIST RISOGRAPH ILLUSTRATION -->
  
      <!-- Scanner / Layered Inspection -->
      <g transform="translate(1350, 480)">
        <!-- Pedestal -->
        <path d="M-220 320 L220 320 L280 400 L-280 400 Z" fill="#8cb39d" opacity="0.9" />
        <rect x="-280" y="400" width="560" height="70" fill="#4a735c" />
        <path d="M-180 240 L180 240 L220 320 L-220 320 Z" fill="#b2d4c2" />

        <!-- Layer 3: Metadonnées XMP -->
        <g transform="translate(0, 160)">
          <path d="M-140 0 L140 0 L180 60 L-100 60 Z" fill="#01946c" opacity="0.85" />
          <rect x="-140" y="0" width="280" height="18" rx="4" fill="#027557" />
          <text x="0" y="42" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MÉTADONNÉES XMP</text>
        </g>

        <!-- Layer 2: XML CII -->
        <g transform="translate(0, 80)">
          <path d="M-150 0 L150 0 L190 60 L-110 60 Z" fill="#02b282" opacity="0.9" />
          <rect x="-150" y="0" width="300" height="18" rx="4" fill="#01946c" />
          <text x="0" y="42" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">XML EN 16931 / CII</text>
        </g>

        <!-- Layer 1: PDF/A-3 Document -->
        <g transform="translate(0, -100)">
          <rect x="-120" y="-120" width="240" height="320" rx="12" fill="#fbf9f5" stroke="#054c3a" stroke-width="12" />
          <path d="M70 -120 L120 -70 L70 -70 Z" fill="#02b282" />
          <line x1="-80" y1="-50" x2="40" y2="-50" stroke="#054c3a" stroke-width="12" stroke-linecap="round" />
          <line x1="-80" y1="-10" x2="80" y2="-10" stroke="#054c3a" stroke-width="12" stroke-linecap="round" />
          <line x1="-80" y1="30" x2="80" y2="30" stroke="#054c3a" stroke-width="12" stroke-linecap="round" />
          <line x1="-80" y1="70" x2="20" y2="70" stroke="#054c3a" stroke-width="12" stroke-linecap="round" />
          
          <!-- Scan beam -->
          <line x1="-160" y1="10" x2="160" y2="10" stroke="#e05656" stroke-width="6" stroke-dasharray="10 8" />
          <circle cx="160" cy="10" r="14" fill="#e05656" />
        </g>

        <!-- Decorative accents -->
        <circle cx="160" cy="-200" r="50" fill="#e05656" opacity="0.85" filter="url(#grain-filter)" />
        <circle cx="-160" cy="80" r="35" fill="#e05656" opacity="0.7" />
        <circle cx="180" cy="180" r="24" fill="#02b282" />
      </g>
    
</svg>