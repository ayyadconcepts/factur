<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Paper texture grain simulation -->
    <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.94   0 0 0 0 0.92   0 0 0 0.07 0" />
      <feComposite in2="SourceGraphic" in="glitch" operator="in" />
    </filter>
  </defs>

  <!-- Cream Paper Background -->
  <rect width="1920" height="1080" fill="#f4f0ea" />

  <!-- Subtle Paper Grain Overlay -->
  <rect width="1920" height="1080" fill="#eae4da" opacity="0.35" />

  <!-- LEFT TYPOGRAPHY COLUMN -->
  <g transform="translate(120, 0)">
    <!-- Category Eyebrow -->
    <text x="0" y="160" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#78736a">
      RESSOURCES · COMPARATIFS · 2026
    </text>

    <!-- Main Title Lines -->
    <text x="0" y="380" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      Étude : quels exports
    </text>
    <text x="0" y="475" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      PDF passent le
    </text>
    
    <text x="0" y="570" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      contrôle Factur-X ?
    </text>

    <!-- Thick Emerald Accent Bar -->
    <rect x="0" y="630" width="650" height="28" rx="4" fill="#02b282" />

    <!-- Subtitle -->
    <text x="0" y="725" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="34" 
          font-weight="400" 
          letter-spacing="-0.5" 
          fill="#141312">
      Banc d’essai de 15 logiciels bureautiques et taux de conformité PDF/A-3
    </text>

    <!-- Brand / URL at bottom -->
    <text x="0" y="940" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#141312">
      facturxfacile.com
    </text>
  </g>

  <!-- RIGHT MINIMALIST RISOGRAPH ILLUSTRATION -->
  
      <!-- Laboratory & Metrics Gauge -->
      <g transform="translate(1350, 480)">
        <!-- Pedestal base -->
        <path d="M-240 280 L240 280 L280 360 L-280 360 Z" fill="#8cb39d" />
        <rect x="-280" y="360" width="560" height="60" fill="#4a735c" />

        <!-- Metric Cylinder 1: <10% Conformes par défaut -->
        <g transform="translate(-120, 60)">
          <rect x="-40" y="-160" width="80" height="220" rx="40" fill="#eae4da" stroke="#054c3a" stroke-width="8" />
          <rect x="-34" y="0" width="68" height="54" rx="27" fill="#e05656" />
          <circle cx="0" cy="-190" r="30" fill="#e05656" />
          <text x="0" y="-183" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;10%</text>
          <text x="0" y="90" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#054c3a" text-anchor="middle">PDF/A-3 direct</text>
        </g>

        <!-- Metric Cylinder 2: 60% Polices -->
        <g transform="translate(10, -20)">
          <rect x="-40" y="-160" width="80" height="280" rx="40" fill="#eae4da" stroke="#054c3a" stroke-width="8" />
          <rect x="-34" y="-20" width="68" height="134" rx="27" fill="#02b282" />
          <circle cx="0" cy="-190" r="30" fill="#02b282" />
          <text x="0" y="-183" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">60%</text>
          <text x="0" y="150" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#054c3a" text-anchor="middle">Polices OK</text>
        </g>

        <!-- Metric Block: 15 Outils -->
        <g transform="translate(140, -100)">
          <rect x="-50" y="-50" width="100" height="100" rx="18" fill="#054c3a" />
          <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1ec195" text-anchor="middle">15</text>
          <text x="0" y="24" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">OUTILS</text>
        </g>

        <!-- Circular stamp -->
        <circle cx="160" cy="180" r="45" fill="#02b282" opacity="0.9" />
        <path d="M142 180 L154 192 L178 168" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      </g>
    
</svg>