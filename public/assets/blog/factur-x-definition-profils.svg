<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Paper texture grain simulation -->
    <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.95   0 0 0 0 0.94   0 0 0 0 0.92   0 0 0 0.07 0" />
      <feComposite in2="SourceGraphic" in="glitch" operator="in" />
    </filter>
  </defs>

  <!-- Cream Paper Background -->
  <rect width="1920" height="1080" fill="#f4f0ea" />

  <!-- Subtle Paper Grain Overlay -->
  <rect width="1920" height="1080" fill="#eae4da" opacity="0.35" />

  <!-- LEFT TYPOGRAPHY COLUMN -->
  <g transform="translate(120, 0)">
    <!-- Category Eyebrow -->
    <text x="0" y="160" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#78736a">
      RESSOURCES · NORMES · 2026
    </text>

    <!-- Main Title Lines -->
    <text x="0" y="380" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      Factur-X : définition
    </text>
    <text x="0" y="475" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      et profils, lequel
    </text>
    
    <text x="0" y="570" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#141312">
      choisir ?
    </text>

    <!-- Thick Emerald Accent Bar -->
    <rect x="0" y="630" width="650" height="28" rx="4" fill="#02b282" />

    <!-- Subtitle -->
    <text x="0" y="725" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="34" 
          font-weight="400" 
          letter-spacing="-0.5" 
          fill="#141312">
      Du profil MINIMUM au profil EXTENDED : quel niveau pour votre entreprise ?
    </text>

    <!-- Brand / URL at bottom -->
    <text x="0" y="940" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#141312">
      facturxfacile.com
    </text>
  </g>

  <!-- RIGHT MINIMALIST RISOGRAPH ILLUSTRATION -->
  
      <!-- Stepped Profiles Pyramid / Tiers -->
      <g transform="translate(1350, 500)">
        <!-- Pedestal base -->
        <rect x="-260" y="300" width="520" height="60" rx="6" fill="#4a735c" />

        <!-- Profile 1: MINIMUM -->
        <path d="M-220 220 L220 220 L250 300 L-250 300 Z" fill="#b2d4c2" stroke="#054c3a" stroke-width="4" />
        <text x="0" y="270" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#054c3a" text-anchor="middle">1. MINIMUM</text>

        <!-- Profile 2: BASIC WL -->
        <path d="M-180 140 L180 140 L210 220 L-210 220 Z" fill="#8ce3c8" stroke="#054c3a" stroke-width="4" />
        <text x="0" y="190" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#054c3a" text-anchor="middle">2. BASIC WL</text>

        <!-- Profile 3: BASIC -->
        <path d="M-140 60 L140 60 L170 140 L-170 140 Z" fill="#4ed2ab" stroke="#054c3a" stroke-width="4" />
        <text x="0" y="110" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#054c3a" text-anchor="middle">3. BASIC</text>

        <!-- Profile 4: EN 16931 (Highlighted) -->
        <path d="M-100 -30 L100 -30 L130 60 L-130 60 Z" fill="#02b282" stroke="#054c3a" stroke-width="6" />
        <text x="0" y="25" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">★ EN 16931</text>

        <!-- Profile 5: EXTENDED -->
        <path d="M-50 -120 L50 -120 L80 -30 L-80 -30 Z" fill="#01946c" stroke="#054c3a" stroke-width="4" />
        <text x="0" y="-65" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">EXTENDED</text>

        <!-- Dynamic red callout on EN 16931 -->
        <circle cx="160" cy="15" r="42" fill="#e05656" />
        <text x="160" y="21" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">B2B</text>
      </g>
    
</svg>